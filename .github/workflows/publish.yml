name: Publish Package

# Manual only: tag pushes must not publish. Releases are published to npm by
# hand, and the automatic run used to fail at the npm step because trusted
# publishing is not configured. Tags still mark releases; run this workflow
# from the Actions tab when you want CI to publish.
on:
  workflow_dispatch:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish
